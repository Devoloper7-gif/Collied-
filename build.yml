name: Build APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
          KP: ${{ secrets.KEYSTORE_PASSWORD }}
          KA: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KS" ] || [ -z "$KP" ] || [ -z "$KA" ]; then echo "Secrets missing: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS"; exit 1; fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Web files into www
        run: |
          mkdir www
          cp index.html style.css app.js meta.js sw.js manifest.json icon-*.png www/
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in v*) ;; *) TAG="v0.0.0-dev" ;; esac
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          sed -i -E "s/(const VERSION = )'[^']*'/\1'${TAG}'/" www/app.js
          grep -n "const VERSION" www/app.js

      - name: Create Android project
        run: |
          npm install
          npx cap add android

      - name: Patch version, icons, black bars, signing
        env:
          RUN: ${{ github.run_number }}
        run: |
          pip install pillow
          python3 - <<'PY'
          import os, re, sys, shutil
          from PIL import Image, ImageDraw
          tag = os.environ['TAG']; code = os.environ['RUN']
          # ---- version + signing ----
          p = 'android/app/build.gradle'; s = open(p).read()
          s, a = re.subn(r'versionCode \d+', 'versionCode ' + code, s, 1)
          s, b = re.subn(r'versionName "[^"]*"', 'versionName "%s"' % tag.lstrip('v'), s, 1)
          sign = ('signingConfigs {\n        release {\n'
                  '            storeFile file(System.getenv("KS_PATH"))\n'
                  '            storePassword System.getenv("KS_PASS")\n'
                  '            keyAlias System.getenv("KEY_ALIAS")\n'
                  '            keyPassword System.getenv("KEY_PASS")\n'
                  '        }\n    }\n    buildTypes {')
          s, c = re.subn(r'buildTypes \{', lambda m: sign, s, 1)
          s, d = re.subn(r'(buildTypes \{\s*release \{)', r'\1\n            signingConfig signingConfigs.release', s, 1)
          if not (a and b and c and d): print('build.gradle patch failed', a, b, c, d); sys.exit(1)
          open(p, 'w').write(s)
          # ---- pure black system bars + black launch screen ----
          p = 'android/app/src/main/res/values/styles.xml'; s = open(p).read()
          items = '<item name="android:statusBarColor">#000000</item><item name="android:navigationBarColor">#000000</item><item name="android:windowBackground">#000000</item>'
          s = re.sub(r'(<style name="AppTheme.NoActionBar"[^>]*>)', lambda m: m.group(1) + items, s, 1)
          s = s.replace('@drawable/splash', '@android:color/black')
          open(p, 'w').write(s)
          # ---- launcher icons from icon-maskable-512.png (black background) ----
          src = Image.open('icon-maskable-512.png').convert('RGB')
          res = 'android/app/src/main/res'
          shutil.rmtree(res + '/mipmap-anydpi-v26', ignore_errors=True)
          for d, sz in {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}.items():
              im = src.resize((sz, sz), Image.LANCZOS)
              os.makedirs('%s/mipmap-%s' % (res, d), exist_ok=True)
              im.save('%s/mipmap-%s/ic_launcher.png' % (res, d))
              m = Image.new('L', (sz, sz), 0); ImageDraw.Draw(m).ellipse((0, 0, sz - 1, sz - 1), fill=255)
              r = Image.new('RGBA', (sz, sz), (0, 0, 0, 0)); r.paste(im, (0, 0), m)
              r.save('%s/mipmap-%s/ic_launcher_round.png' % (res, d))
              fg = '%s/mipmap-%s/ic_launcher_foreground.png' % (res, d)
              if os.path.exists(fg): os.remove(fg)
          print('patched ok')
          PY

      - name: Keystore
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KS" | base64 -d > "$GITHUB_WORKSPACE/collied.jks"

      - name: Build signed APK
        env:
          KS_PATH: ${{ github.workspace }}/collied.jks
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cd ..
          cp android/app/build/outputs/apk/release/app-release.apk "Collied-${TAG}.apk"
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "Collied-${TAG}.apk" | head -3 || true

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: Collied-${{ env.TAG }}.apk
          generate_release_notes: true
