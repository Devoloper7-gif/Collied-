name: Build APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
          KP: ${{ secrets.KEYSTORE_PASSWORD }}
          KA: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KS" ] || [ -z "$KP" ] || [ -z "$KA" ]; then echo "Secrets missing: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS"; exit 1; fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Web files into www
        run: |
          mkdir www
          cp index.html style.css app.js meta.js sw.js manifest.json icon-*.png www/
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in v*) ;; *) TAG="v0.0.0-dev" ;; esac
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          sed -i -E "s/(const VERSION = )'[^']*'/\1'${TAG}'/" www/app.js
          grep -n "const VERSION" www/app.js

      - name: Create Android project
        run: |
          npm install
          npx cap add android

      - name: Write native Android files
        run: |
          mkdir -p native/res/drawable
          cat > native/MediaControlPlugin.java <<'NATIVEEOF'
          package com.collied.player;

          import android.Manifest;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.service.notification.StatusBarNotification;
          import androidx.core.app.NotificationManagerCompat;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.os.Build;
          import android.os.Handler;
          import android.os.Looper;
          import android.util.Base64;

          import androidx.core.content.ContextCompat;

          import com.getcapacitor.JSObject;
          import com.getcapacitor.PermissionState;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.annotation.Permission;
          import com.getcapacitor.annotation.PermissionCallback;

          @CapacitorPlugin(
              name = "MediaControl",
              permissions = { @Permission(strings = { Manifest.permission.POST_NOTIFICATIONS }, alias = "notifications") }
          )
          public class MediaControlPlugin extends Plugin {

              static MediaControlPlugin inst;
              static int emitted = 0;
              static String lastAct = "";

              @Override
              public void load() {
                  inst = this;
              }

              /** Sends a button press (play, pause, next, prev, seek, shuffle, repeat, stop) to app.js */
              static void emit(String name, double position) {
                  MediaControlPlugin p = inst;
                  if (p == null) { if (name.equals("play")) MediaService.resume(); return; }
                  JSObject o = new JSObject();
                  emitted++;
                  lastAct = name;
                  o.put("name", name);
                  if (position >= 0) o.put("position", position);
                  try { final MediaControlPlugin q = p; q.getActivity().runOnUiThread(() -> { try { q.getBridge().getWebView().onResume(); q.getBridge().getWebView().resumeTimers(); } catch (Exception ignored) { } }); } catch (Exception ignored) { }   // wake a page that Android froze in the background
                  p.notifyListeners("action", o);
              }

              static void emit(String name) {
                  emit(name, -1);
              }

              /** Sends the app to the background (music keeps playing) */
              /** Setting: start playing when headphones connect (also remembered natively for when the app screen is closed) */
              @PluginMethod
              public void hp(PluginCall call) {
                  boolean on = Boolean.TRUE.equals(call.getBoolean("on", false));
                  MediaService.hpAuto = on;
                  try { getContext().getSharedPreferences("collied", Context.MODE_PRIVATE).edit().putBoolean("hp", on).apply(); } catch (Exception ignored) { }
                  call.resolve();
              }

              /** True once if play was pressed in the notification while the app was closed */
              @PluginMethod
              public void pending(PluginCall call) {
                  JSObject o = new JSObject();
                  o.put("play", MediaService.pendingPlay);
                  MediaService.pendingPlay = false;
                  call.resolve(o);
              }

              @PluginMethod
              public void minimize(PluginCall call) {
                  try { getActivity().moveTaskToBack(true); } catch (Exception e) { MediaService.lastError = "min: " + e; }
                  call.resolve();
              }

              @PluginMethod
              public void requestNotif(PluginCall call) {
                  if (Build.VERSION.SDK_INT >= 33 && getPermissionState("notifications") != PermissionState.GRANTED) {
                      requestPermissionForAlias("notifications", call, "permDone");
                  } else {
                      call.resolve();
                  }
              }

              @PermissionCallback
              private void permDone(PluginCall call) {
                  if (getPermissionState("notifications") == PermissionState.GRANTED) {
                      final MediaService svc = MediaService.instance;
                      if (svc != null) {
                          new Handler(Looper.getMainLooper()).post(new Runnable() {
                              @Override
                              public void run() {
                                  svc.refresh();
                              }
                          });
                      } else if (MediaService.playing) {
                          try {
                              Context c = getContext();
                              Intent i = new Intent(c, MediaService.class);
                              i.setAction("collied.update");
                              ContextCompat.startForegroundService(c, i);
                          } catch (Exception e) {
                              MediaService.lastError = "start: " + e;
                          }
                      }
                  }
                  call.resolve();
              }

              /** Numbers for the in-app "Check media notification" button */
              @PluginMethod
              public void status(PluginCall call) {
                  JSObject o = new JSObject();
                  Context c = getContext();
                  try {
                      o.put("sdk", Build.VERSION.SDK_INT);
                      o.put("notifAllowed", NotificationManagerCompat.from(c).areNotificationsEnabled());
                      o.put("serviceUp", MediaService.instance != null);
                      o.put("playing", MediaService.playing);
                      o.put("title", MediaService.title);
                      o.put("hasArt", MediaService.art != null);
                      o.put("updates", MediaService.updates);
                      o.put("refreshes", MediaService.refreshes);
                      o.put("keys", MediaService.keys);
                      o.put("emitted", emitted);
                      o.put("lastAct", lastAct);
                      o.put("lastError", MediaService.lastError);
                      NotificationManager nm = (NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE);
                      if (Build.VERSION.SDK_INT >= 23) {
                          boolean posted = false;
                          for (StatusBarNotification s : nm.getActiveNotifications()) if (s.getId() == MediaService.NID) posted = true;
                          o.put("posted", posted);
                      }
                      if (Build.VERSION.SDK_INT >= 26) {
                          NotificationChannel ch = nm.getNotificationChannel(MediaService.CH);
                          o.put("channel", ch == null ? -1 : ch.getImportance());
                      }
                  } catch (Exception e) {
                      o.put("lastError", "status: " + e);
                  }
                  call.resolve(o);
              }

              @PluginMethod
              public void update(PluginCall call) {
                  MediaService.updates++;
                  Boolean meta = call.getBoolean("meta", false);
                  if (meta != null && meta) {
                      MediaService.title = call.getString("title", "");
                      MediaService.artist = call.getString("artist", "");
                      MediaService.album = call.getString("album", "");
                      MediaService.art = decode(call.getString("art", ""));
                  }
                  Double d = call.getDouble("duration", 0.0);
                  Double p = call.getDouble("position", 0.0);
                  Double s = call.getDouble("speed", 1.0);
                  Boolean pl = call.getBoolean("playing", false);
                  Boolean sh = call.getBoolean("shuffle", false);
                  Integer rp = call.getInt("repeat", 0);
                  MediaService.durMs = (long) ((d == null ? 0 : d) * 1000);
                  MediaService.posMs = (long) ((p == null ? 0 : p) * 1000);
                  MediaService.speed = (float) (s == null ? 1.0 : s);
                  MediaService.playing = pl != null && pl;
                  MediaService.shuffle = sh != null && sh;
                  MediaService.repeat = rp == null ? 0 : rp;

                  final MediaService svc = MediaService.instance;
                  if (svc != null) {
                      new Handler(Looper.getMainLooper()).post(new Runnable() {
                          @Override
                          public void run() {
                              svc.refresh();
                          }
                      });
                  } else {
                      try {
                          Context c = getContext();
                          Intent i = new Intent(c, MediaService.class);
                          i.setAction("collied.update");
                          ContextCompat.startForegroundService(c, i);
                      } catch (Exception e) {
                          MediaService.lastError = "start: " + e;
                      }
                  }
                  call.resolve();
              }

              private static Bitmap decode(String data) {
                  try {
                      if (data == null || data.length() < 40) return null;
                      int k = data.indexOf("base64,");
                      String b = k >= 0 ? data.substring(k + 7) : data;
                      byte[] bytes = Base64.decode(b, Base64.DEFAULT);
                      return BitmapFactory.decodeByteArray(bytes, 0, bytes.length);
                  } catch (Exception e) {
                      return null;
                  }
              }
          }
          NATIVEEOF
          cat > native/MediaService.java <<'NATIVEEOF'
          package com.collied.player;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.BroadcastReceiver;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.content.pm.ServiceInfo;
          import android.graphics.Bitmap;
          import android.media.AudioManager;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.SystemClock;
          import android.support.v4.media.MediaMetadataCompat;
          import android.support.v4.media.session.MediaSessionCompat;
          import android.support.v4.media.session.PlaybackStateCompat;

          import androidx.core.app.NotificationCompat;
          import androidx.core.app.ServiceCompat;
          import androidx.core.content.ContextCompat;
          import androidx.media.session.MediaButtonReceiver;

          public class MediaService extends Service {

              static final String CH = "collied_playback";
              static final int NID = 7;

              static MediaService instance;
              static boolean pendingPlay = false, hpAuto = false;
              private android.media.AudioDeviceCallback hpCb;
              private boolean hpArmed = false;
              private static boolean isHp(int t) { return t == 3 || t == 4 || t == 8 || t == 22 || t == 26; }   // wired, wired headphones, bluetooth A2DP, USB headset, BLE headset
              private android.os.PowerManager.WakeLock wl;

              /** Play was pressed (notification / headset) while the app screen is gone: remember it and bring the app back so it can start the song */
              static void resume() {
                  pendingPlay = true;
                  MediaService s = instance;
                  if (s == null) return;
                  try {
                      Intent i = new Intent(s, MainActivity.class);
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                      s.startActivity(i);
                  } catch (Exception e) { lastError = "resume: " + e; }
              }

              private void wake(boolean on) {
                  try {
                      if (on) {
                          if (wl == null) { wl = ((android.os.PowerManager) getSystemService(Context.POWER_SERVICE)).newWakeLock(android.os.PowerManager.PARTIAL_WAKE_LOCK, "collied:play"); wl.setReferenceCounted(false); }
                          if (!wl.isHeld()) wl.acquire();
                      } else if (wl != null && wl.isHeld()) wl.release();
                  } catch (Exception e) { lastError = "wl: " + e; }
              }
              static String title = "", artist = "", album = "";
              static Bitmap art;
              static long durMs = 0, posMs = 0;
              static boolean playing = false, shuffle = false;
              static float speed = 1f;
              static int repeat = 0; // 0 off, 1 all, 2 one
              static String lastError = "";
              static int refreshes = 0, keys = 0, updates = 0;

              private MediaSessionCompat session;
              private NotificationManager nm;
              private boolean fg = false, needFg = true;

              private final BroadcastReceiver noisy = new BroadcastReceiver() {
                  @Override
                  public void onReceive(Context c, Intent i) {
                      if (AudioManager.ACTION_AUDIO_BECOMING_NOISY.equals(i.getAction())) MediaControlPlugin.emit("pause");
                  }
              };

              @Override
              public void onCreate() {
                  super.onCreate();
                  instance = this;
                  try { hpAuto = getSharedPreferences("collied", Context.MODE_PRIVATE).getBoolean("hp", false); } catch (Exception ignored) { }
                  if (Build.VERSION.SDK_INT >= 23) {
                      try {
                          final AudioManager am = (AudioManager) getSystemService(Context.AUDIO_SERVICE);
                          hpCb = new android.media.AudioDeviceCallback() {
                              @Override public void onAudioDevicesAdded(android.media.AudioDeviceInfo[] added) {
                                  if (!hpArmed || !hpAuto || playing) return;
                                  for (android.media.AudioDeviceInfo d : added) {
                                      if (d.isSink() && isHp(d.getType())) { MediaControlPlugin.emit("play"); return; }
                                  }
                              }
                          };
                          am.registerAudioDeviceCallback(hpCb, new android.os.Handler(android.os.Looper.getMainLooper()));
                          new android.os.Handler(android.os.Looper.getMainLooper()).postDelayed(() -> hpArmed = true, 1500);   // ignore the devices that were already connected
                      } catch (Exception e) { lastError = "hp: " + e; }
                  }
                  nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationChannel ch = new NotificationChannel(CH, "Playback", NotificationManager.IMPORTANCE_LOW);
                      ch.setShowBadge(false);
                      ch.setLockscreenVisibility(Notification.VISIBILITY_PUBLIC);
                      nm.createNotificationChannel(ch);
                  }
                  session = new MediaSessionCompat(this, "Collied");
                  session.setFlags(MediaSessionCompat.FLAG_HANDLES_MEDIA_BUTTONS | MediaSessionCompat.FLAG_HANDLES_TRANSPORT_CONTROLS);
                  try {
                      Intent mbi = new Intent(Intent.ACTION_MEDIA_BUTTON);
                      mbi.setComponent(new ComponentName(this, MediaButtonReceiver.class));
                      session.setMediaButtonReceiver(PendingIntent.getBroadcast(this, 0, mbi, (Build.VERSION.SDK_INT >= 31 ? PendingIntent.FLAG_MUTABLE : 0) | PendingIntent.FLAG_UPDATE_CURRENT));
                  } catch (Exception e) { lastError = "mbr: " + e; }
                  session.setCallback(new MediaSessionCompat.Callback() {
                      @Override
                      public boolean onMediaButtonEvent(Intent mediaButtonEvent) {
                          keys++;   // counted so the in-app check can show that headset keys arrive
                          return super.onMediaButtonEvent(mediaButtonEvent);
                      }
                      @Override public void onPlay() { MediaControlPlugin.emit("play"); }
                      @Override public void onPause() { MediaControlPlugin.emit("pause"); }
                      @Override public void onSkipToNext() { MediaControlPlugin.emit("next"); }
                      @Override public void onSkipToPrevious() { MediaControlPlugin.emit("prev"); }
                      @Override public void onStop() { MediaControlPlugin.emit("pause"); }
                      @Override public void onSeekTo(long pos) { MediaControlPlugin.emit("seek", pos / 1000.0); }
                      @Override public void onCustomAction(String action, android.os.Bundle extras) {
                          if ("shuffle".equals(action)) { shuffle = !shuffle; refresh(); MediaControlPlugin.emit("shuffle"); }
                          else if ("repeat".equals(action)) { repeat = (repeat + 1) % 3; refresh(); MediaControlPlugin.emit("repeat"); }
                      }
                  });
                  session.setActive(true);
                  ContextCompat.registerReceiver(this, noisy, new IntentFilter(AudioManager.ACTION_AUDIO_BECOMING_NOISY), ContextCompat.RECEIVER_NOT_EXPORTED);
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  String a = intent == null ? null : intent.getAction();
                  if (Intent.ACTION_MEDIA_BUTTON.equals(a)) {
                      refresh();
                      try { MediaButtonReceiver.handleIntent(session, intent); } catch (Exception e) { lastError = "key: " + e; }
                      return START_NOT_STICKY;
                  }
                  if (a != null) {
                      if (a.equals("collied.toggle")) MediaControlPlugin.emit(playing ? "pause" : "play");
                      else if (a.equals("collied.next")) MediaControlPlugin.emit("next");
                      else if (a.equals("collied.prev")) MediaControlPlugin.emit("prev");
                      else if (a.equals("collied.shuffle")) { shuffle = !shuffle; refresh(); MediaControlPlugin.emit("shuffle"); }
                      else if (a.equals("collied.repeat")) { repeat = (repeat + 1) % 3; refresh(); MediaControlPlugin.emit("repeat"); }
                  }
                  refresh();
                  return START_NOT_STICKY;
              }

              void refresh() {
                  if (session == null) return;
                  refreshes++;
                  wake(playing);
                  MediaMetadataCompat.Builder mb = new MediaMetadataCompat.Builder()
                      .putString(MediaMetadataCompat.METADATA_KEY_TITLE, title)
                      .putString(MediaMetadataCompat.METADATA_KEY_ARTIST, artist)
                      .putString(MediaMetadataCompat.METADATA_KEY_ALBUM, album)
                      .putLong(MediaMetadataCompat.METADATA_KEY_DURATION, durMs);
                  if (art != null) {
                      mb.putBitmap(MediaMetadataCompat.METADATA_KEY_ALBUM_ART, art);
                      mb.putBitmap(MediaMetadataCompat.METADATA_KEY_ART, art);
                  }
                  session.setMetadata(mb.build());

                  long actions = PlaybackStateCompat.ACTION_PLAY | PlaybackStateCompat.ACTION_PAUSE | PlaybackStateCompat.ACTION_PLAY_PAUSE
                      | PlaybackStateCompat.ACTION_SKIP_TO_NEXT | PlaybackStateCompat.ACTION_SKIP_TO_PREVIOUS
                      | PlaybackStateCompat.ACTION_SEEK_TO | PlaybackStateCompat.ACTION_STOP;
                  PlaybackStateCompat.Builder pb = new PlaybackStateCompat.Builder()
                      .setActions(actions)
                      .setState(playing ? PlaybackStateCompat.STATE_PLAYING : PlaybackStateCompat.STATE_PAUSED,
                          posMs, playing ? speed : 0f, SystemClock.elapsedRealtime());
                  pb.addCustomAction(new PlaybackStateCompat.CustomAction.Builder("shuffle",
                      shuffle ? "Shuffle on" : "Shuffle off", shuffle ? R.drawable.ic_c_shuffle_on : R.drawable.ic_c_shuffle).build());
                  pb.addCustomAction(new PlaybackStateCompat.CustomAction.Builder("repeat",
                      repeat == 0 ? "Repeat off" : (repeat == 1 ? "Repeat all" : "Repeat one"),
                      repeat == 0 ? R.drawable.ic_c_repeat : (repeat == 1 ? R.drawable.ic_c_repeat_on : R.drawable.ic_c_repeat_one)).build());
                  session.setPlaybackState(pb.build());

                  Notification n = buildNotification();
                  try {
                      if (!fg && (playing || needFg)) {   // go foreground once; after that only update (re-entering while in background throws on Android 12+)
                          int type = Build.VERSION.SDK_INT >= 29 ? ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK : 0;
                          ServiceCompat.startForeground(this, NID, n, type);
                          fg = true;
                          needFg = false;
                      } else {
                          nm.notify(NID, n);
                      }
                  } catch (Exception e) {
                      lastError = "fg: " + e;
                      try { nm.notify(NID, n); } catch (Exception e2) { lastError += " | notify: " + e2; }
                  }
              }

              private PendingIntent act(String name, int code) {
                  Intent i = new Intent(this, MediaService.class);
                  i.setAction(name);
                  return PendingIntent.getService(this, code, i, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
              }

              private Notification buildNotification() {
                  Intent open = new Intent(this, MainActivity.class);
                  open.setFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  PendingIntent content = PendingIntent.getActivity(this, 0, open, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);

                  NotificationCompat.Builder b = new NotificationCompat.Builder(this, CH)
                      .setSmallIcon(R.drawable.ic_c_stat)
                      .setContentTitle(title)
                      .setContentText(artist)
                      .setSubText(album)
                      .setContentIntent(content)
                      .setVisibility(NotificationCompat.VISIBILITY_PUBLIC)
                      .setOnlyAlertOnce(true)
                      .setShowWhen(false)
                      .setOngoing(playing)
                      .setCategory(NotificationCompat.CATEGORY_TRANSPORT);
                  if (art != null) b.setLargeIcon(art);
                  b.addAction(shuffle ? R.drawable.ic_c_shuffle_on : R.drawable.ic_c_shuffle, "Shuffle", act("collied.shuffle", 1));
                  b.addAction(R.drawable.ic_c_prev, "Previous", act("collied.prev", 2));
                  b.addAction(playing ? R.drawable.ic_c_pause : R.drawable.ic_c_play, playing ? "Pause" : "Play", act("collied.toggle", 3));
                  b.addAction(R.drawable.ic_c_next, "Next", act("collied.next", 4));
                  b.addAction(repeat == 0 ? R.drawable.ic_c_repeat : (repeat == 1 ? R.drawable.ic_c_repeat_on : R.drawable.ic_c_repeat_one), "Repeat", act("collied.repeat", 5));
                  androidx.media.app.NotificationCompat.MediaStyle st = new androidx.media.app.NotificationCompat.MediaStyle();
                  st.setMediaSession(session.getSessionToken());
                  st.setShowActionsInCompactView(1, 2, 3);
                  b.setStyle(st);
                  return b.build();
              }

              @Override
              public void onTaskRemoved(Intent rootIntent) {
                  playing = false;
                  try { nm.cancel(NID); } catch (Exception ignored) { }
                  stopSelf();
              }

              @Override
              public void onDestroy() {
                  instance = null;
                  try { if (hpCb != null) ((AudioManager) getSystemService(Context.AUDIO_SERVICE)).unregisterAudioDeviceCallback(hpCb); } catch (Exception ignored) { }
                  try { unregisterReceiver(noisy); } catch (Exception ignored) { }
                  if (session != null) {
                      session.setActive(false);
                      session.release();
                      session = null;
                  }
                  super.onDestroy();
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }
          }
          NATIVEEOF
          cat > native/res/drawable/ic_c_next.xml <<'NATIVEEOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#FFFFFFFF" android:pathData="M6,18l8.5,-6L6,6v12zM16,6v12h2V6h-2z"/></vector>
          NATIVEEOF
          cat > native/res/drawable/ic_c_pause.xml <<'NATIVEEOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#FFFFFFFF" android:pathData="M6,19h4V5H6v14zM14,5v14h4V5h-4z"/></vector>
          NATIVEEOF
          cat > native/res/drawable/ic_c_play.xml <<'NATIVEEOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#FFFFFFFF" android:pathData="M8,5v14l11,-7z"/></vector>
          NATIVEEOF
          cat > native/res/drawable/ic_c_prev.xml <<'NATIVEEOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#FFFFFFFF" android:pathData="M6,6h2v12H6zM9.5,12l8.5,6V6z"/></vector>
          NATIVEEOF
          cat > native/res/drawable/ic_c_repeat.xml <<'NATIVEEOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#FFFFFFFF" android:pathData="M7,7h10v3l4,-4 -4,-4v3H5v6h2V7zM17,17H7v-3l-4,4 4,4v-3h12v-6h-2v4z"/></vector>
          NATIVEEOF
          cat > native/res/drawable/ic_c_repeat_on.xml <<'NATIVEEOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#FFFFFFFF" android:pathData="M7,7h10v3l4,-4 -4,-4v3H5v6h2V7zM17,17H7v-3l-4,4 4,4v-3h12v-6h-2v4z M19,19m-2.2,0a2.2,2.2 0 1,0 4.4,0a2.2,2.2 0 1,0 -4.4,0"/></vector>
          NATIVEEOF
          cat > native/res/drawable/ic_c_repeat_one.xml <<'NATIVEEOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#FFFFFFFF" android:pathData="M7,7h10v3l4,-4 -4,-4v3H5v6h2V7zM17,17H7v-3l-4,4 4,4v-3h12v-6h-2v4zM13,15V9h-1l-2,1v1h1.5v4H13z"/></vector>
          NATIVEEOF
          cat > native/res/drawable/ic_c_shuffle.xml <<'NATIVEEOF'
