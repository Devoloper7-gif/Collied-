      - name: Patch version, icons, black bars, signing
        env:
          RUN: ${{ github.run_number }}
        run: |
          pip install pillow
          python3 - <<'PY'
          import os, re, sys, shutil
          from PIL import Image, ImageDraw
          tag = os.environ['TAG']; code = os.environ['RUN']
          # ---- version + signing ----
          p = 'android/app/build.gradle'; s = open(p).read()
          s, a = re.subn(r'versionCode \d+', 'versionCode ' + code, s, 1)
          s, b = re.subn(r'versionName "[^"]*"', 'versionName "%s"' % tag.lstrip('v'), s, 1)
          sign = ('signingConfigs {\n        release {\n'
                  '            storeFile file(System.getenv("KS_PATH"))\n'
                  '            storePassword System.getenv("KS_PASS")\n'
                  '            keyAlias System.getenv("KEY_ALIAS")\n'
                  '            keyPassword System.getenv("KEY_PASS")\n'
                  '        }\n    }\n    buildTypes {')
          s, c = re.subn(r'buildTypes \{', lambda m: sign, s, 1)
          s, d = re.subn(r'(buildTypes \{\s*release \{)', r'\1\n            signingConfig signingConfigs.release', s, 1)
          if not (a and b and c and d): print('build.gradle patch failed', a, b, c, d); sys.exit(1)
          open(p, 'w').write(s)
          # ---- pure black system bars + black launch screen ----
          p = 'android/app/src/main/res/values/styles.xml'; s = open(p).read()
          items = '<item name="android:statusBarColor">#000000</item><item name="android:navigationBarColor">#000000</item><item name="android:windowBackground">#000000</item>'
          s = re.sub(r'(<style name="AppTheme.NoActionBar"[^>]*>)', lambda m: m.group(1) + items, s, 1)
          s = s.replace('@drawable/splash', '@android:color/black')
          open(p, 'w').write(s)
          # ---- launcher icons from icon-maskable-512.png (black background) ----
          src = Image.open('icon-maskable-512.png').convert('RGB')
          res = 'android/app/src/main/res'
          shutil.rmtree(res + '/mipmap-anydpi-v26', ignore_errors=True)
          for d, sz in {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}.items():
              im = src.resize((sz, sz), Image.LANCZOS)
              os.makedirs('%s/mipmap-%s' % (res, d), exist_ok=True)
              im.save('%s/mipmap-%s/ic_launcher.png' % (res, d))
              m = Image.new('L', (sz, sz), 0); ImageDraw.Draw(m).ellipse((0, 0, sz - 1, sz - 1), fill=255)
              r = Image.new('RGBA', (sz, sz), (0, 0, 0, 0)); r.paste(im, (0, 0), m)
              r.save('%s/mipmap-%s/ic_launcher_round.png' % (res, d))
              fg = '%s/mipmap-%s/ic_launcher_foreground.png' % (res, d)
              if os.path.exists(fg): os.remove(fg)

          # ---- native media plugin: notification, lock screen, headset buttons ----
          import glob
          pkg = 'android/app/src/main/java/com/collied/player'
          os.makedirs(pkg, exist_ok=True)
          for f in ('MediaControlPlugin.java', 'MediaService.java'):
              shutil.copy('native/' + f, pkg + '/' + f)
          dr = res + '/drawable'; os.makedirs(dr, exist_ok=True)
          for f in os.listdir('native/res/drawable'):
              shutil.copy('native/res/drawable/' + f, dr + '/' + f)
          mp = 'android/app/src/main/AndroidManifest.xml'; m = open(mp).read()
          perms = ('<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n'
                   '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />\n'
                   '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n'
                   '    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    ')
          svc = '<service android:name=".MediaService" android:exported="false" android:foregroundServiceType="mediaPlayback" />\n    '
          svc += '<receiver android:name="androidx.media.session.MediaButtonReceiver" android:exported="true"><intent-filter><action android:name="android.intent.action.MEDIA_BUTTON" /></intent-filter></receiver>\n    '
          if '<application' not in m or '</application>' not in m: print('manifest unexpected'); sys.exit(1)
          m = m.replace('<application', perms + '<application', 1).replace('</application>', svc + '</application>', 1)
          open(mp, 'w').write(m)
          p = 'android/app/build.gradle'; s = open(p).read()
          s, n = re.subn(r'dependencies \{', lambda x: 'dependencies {\n    implementation "androidx.media:media:1.7.0"', s, count=1)
          if not n: print('no dependencies block'); sys.exit(1)
          open(p, 'w').write(s)
          mp = glob.glob('android/app/src/main/java/**/MainActivity.java', recursive=True)[0]; s = open(mp).read()
          if 'onCreate' in s or 'onPause' in s: print('MainActivity already has onCreate/onPause - needs a manual merge'); sys.exit(1)
          body = '''extends BridgeActivity {
              @Override
              public void onCreate(android.os.Bundle savedInstanceState) {
                  registerPlugin(MediaControlPlugin.class);
                  super.onCreate(savedInstanceState);
                  try { getBridge().getWebView().getSettings().setMediaPlaybackRequiresUserGesture(false); } catch (Exception e) { }
                  getOnBackPressedDispatcher().addCallback(this, new androidx.activity.OnBackPressedCallback(true) {
                      @Override public void handleOnBackPressed() {
                          if (MediaControlPlugin.inst == null) moveTaskToBack(true);
                          else MediaControlPlugin.emit("back");
                      }
                  });
              }

              @Override
              public void onPause() {
                  super.onPause();
                  if (MediaService.instance != null) {   // also while paused: otherwise the page freezes and the notification buttons do nothing
                      try { getBridge().getWebView().onResume(); getBridge().getWebView().resumeTimers(); } catch (Exception e) { }
                  }
              }
          '''
          s, n = re.subn(r'extends BridgeActivity\s*\{', lambda x: body, s, count=1)
          if not n: print('MainActivity patch failed'); sys.exit(1)
          open(mp, 'w').write(s)
          print('patched ok')
          PY

      - name: Keystore
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KS" | base64 -d > "$GITHUB_WORKSPACE/collied.jks"

      - name: Build signed APK
        env:
          KS_PATH: ${{ github.workspace }}/collied.jks
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cd ..
          cp android/app/build/outputs/apk/release/app-release.apk "Collied-${TAG}.apk"
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "Collied-${TAG}.apk" | head -3 || true

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: Collied-${{ env.TAG }}.apk
          generate_release_notes: true
